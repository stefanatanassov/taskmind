services:
  api:
    build: .
    command: uvicorn taskmind.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      TASKMIND_DATABASE_URL: postgresql+psycopg://taskmind:taskmind@postgres:5432/taskmind
      TASKMIND_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: python -m taskmind.worker.main
    env_file:
      - .env
    environment:
      TASKMIND_DATABASE_URL: postgresql+psycopg://taskmind:taskmind@postgres:5432/taskmind
      TASKMIND_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "taskmind.worker.main", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmind
      POSTGRES_USER: taskmind
      POSTGRES_PASSWORD: taskmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmind -d taskmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

